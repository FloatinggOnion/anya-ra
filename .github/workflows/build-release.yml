name: Build and Release

on:
  push:
    branches:
      - 'codex/platform-build-*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds - both use macos-latest (Apple Silicon runner)
          # x86_64 is cross-compiled from ARM64 (Tauri 2.x supports this)
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          # Windows builds
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            arch: x86
            target: i686-pc-windows-msvc
          - os: windows-latest
            arch: aarch64
            target: aarch64-pc-windows-msvc
          # Linux builds
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          # Native ARM64 runner — avoids QEMU for linuxdeploy AppImage bundling
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Set up MSVC ARM64 cross-compilation environment
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri application
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          # AppImages try to FUSE-mount themselves; GitHub runners have no FUSE.
          # This flag makes the AppImage runtime extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' | head -1)
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR" -quiet; rmdir "$MOUNT_DIR"' EXIT
          codesign --verify --deep --strict "$MOUNT_DIR/Anya.app"

      - name: Prepare release assets
        id: prepare_assets
        run: |
          ASSET_VERSION="${GITHUB_REF_NAME//\//-}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" == "macOS" ]; then
            DMG=$(find "$BUNDLE_DIR" -name "*.dmg" -path "*/dmg/*" | head -1)
            if [ -z "$DMG" ]; then echo "ERROR: No DMG found in build output" && find src-tauri/target -name "*.dmg" 2>/dev/null; exit 1; fi
            mv "$DMG" "Anya_${ASSET_VERSION}_${{ matrix.arch }}.dmg"
            echo "asset_path=Anya_${ASSET_VERSION}_${{ matrix.arch }}.dmg" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" == "Windows" ]; then
            EXE=$(find "$BUNDLE_DIR" -name "*.exe" -path "*/nsis/*" | head -1)
            if [ -z "$EXE" ]; then echo "ERROR: No NSIS installer found in build output" && find src-tauri/target -name "*.exe" 2>/dev/null; exit 1; fi
            mv "$EXE" "Anya_${ASSET_VERSION}_${{ matrix.arch }}.exe"
            echo "asset_path=Anya_${ASSET_VERSION}_${{ matrix.arch }}.exe" >> $GITHUB_OUTPUT
          else
            APPIMAGE=$(find "$BUNDLE_DIR" -name "*.AppImage" -path "*/appimage/*" | head -1)
            if [ -z "$APPIMAGE" ]; then echo "ERROR: No AppImage found in build output" && find src-tauri/target -name "*.AppImage" 2>/dev/null; exit 1; fi
            mv "$APPIMAGE" "Anya_${ASSET_VERSION}_${{ matrix.arch }}.AppImage"
            echo "asset_path=Anya_${ASSET_VERSION}_${{ matrix.arch }}.AppImage" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          if-no-files-found: error
          path: |
            Anya_*.dmg
            Anya_*.exe
            Anya_*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./build-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          find ./build-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) -exec mv {} ./release-assets/ \;
          ls -la ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/*
          draft: false
          prerelease: false
          name: Anya ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
